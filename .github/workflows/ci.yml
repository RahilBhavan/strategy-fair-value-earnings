name: Offline verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12.12', '3.14.0']
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pip==25.2
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Restore frozen sources offline
        run: python scripts/snapshot.py
      - name: Compile Python modules
        run: python -m compileall -q fve scripts tests
      - name: Test source integrity, behavior and deterministic demo
        run: python scripts/validate.py
      - name: Verify generated result figure
        run: |
          python scripts/render_result.py
          git diff --exit-code -- docs/assets/backtest.svg
